# nginx.conf for Windows
# Main configuration file for Nginx

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Add specific MIME types if not in mime.types
    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
    }

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # HLS streaming server configuration
    server {
        listen 80;
        server_name localhost;

        location /media/hls/ {
            root "C:/Users/sanje/OneDrive/Documents/Computer Science/cLiendD/badminton";
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
            
            # Don't cache playlist files
            location ~ \.m3u8$ {
                add_header 'Cache-Control' 'no-cache';
            }
            
            # Cache segment files
            location ~ \.ts$ {
                add_header 'Cache-Control' 'public, max-age=3600';
            }
        }
        
        # Regular media files
        location /media/ {
            root "C:/Users/sanje/OneDrive/Documents/Computer Science/cLiendD/badminton";
            expires 1d;
        }
        
        # Proxy pass to Django
        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}