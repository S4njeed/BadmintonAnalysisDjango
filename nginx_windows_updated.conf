# NGINX configuration for HLS streaming - Updated for Windows
# Place this file at C:\tools\nginx-1.27.4\conf\conf.d\badminton.conf

server {
    listen 80;
    server_name localhost;  # Replace with your domain name in production

    # HLS streaming location
    location /media/hls/ {
        # Set appropriate MIME types for HLS files
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
        
        # Root directory should point to the parent directory of your media folder
        # Using your actual project path
        root C:/Users/sanje/OneDrive/Documents/Computer Science/cLiendD/badminton;
        
        # Add CORS headers to allow cross-origin access
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
        
        # Different cache settings for different file types
        # Don't cache playlist files to ensure they're always fresh
        location ~ \.m3u8$ {
            add_header 'Cache-Control' 'no-cache' always;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length' always;
            root C:/Users/sanje/OneDrive/Documents/Computer Science/cLiendD/badminton;
        }
        
        # Cache segment files for improved performance
        location ~ \.ts$ {
            add_header 'Cache-Control' 'public, max-age=3600' always;
            root C:/Users/sanje/OneDrive/Documents/Computer Science/cLiendD/badminton;
        }
        
        # Optimize for streaming media
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        
        # Configure directory listing (disable in production)
        autoindex off;
    }
    
    # Regular media files location (for non-HLS content)
    location /media/ {
        root C:/Users/sanje/OneDrive/Documents/Computer Science/cLiendD/badminton;
        expires 1d;
    }
    
    # Proxy pass to Django application for all other requests
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}